/*———————————————————————————————————————— harmonize(ref)

    function harmonize : three types of variables

    - localStorage
    - global HTML
    - global CEP

    to start with, we import HTLM & CEP from localstorage
    afterwards, we update CEP & localStorage from HTML

   ref = js | ls
   reference value is javascript or localStorage */

var allVars = [
    'CHANNEL',
    'ISMAC',
    'ISSVIJA',
    'LASTPATH',
    'LOCAL',
    'MASTER',
    'MAXWIDTH',
    'MYDOCS',
    'SERVER',
    'SITEURL',
    'SYNCPATH',
    'TOOLSPATH',
    'VERSION'
]

function harmonize(ref){

  for (x=0; x<allVars.length; x++){
    var varName = allVars[x]

    if (ref=='js' && typeof window[      varName] == 'undefined') continue
    if (ref=='ls' && typeof localStorage[varName] == 'undefined') continue

         if (ref == 'js') var val = window[      varName]
    else if (ref == 'ls') var val = localStorage[varName]
    else return true

    window[varName] = localStorage[varName] = val

    if (typeof window[varName] == 'boolean') var str = varName + '=' +       window[varName]
                                        else var str = varName + '=' + "'" + window[varName] + "'"
    CEP.evalScript(str)

  }
}


harmonize('js')
harmonize('ls')

/*———————————————————————————————————————— loadHtml(str)

    installs an HTML block */

function loadHtml(scriptID, str){
  scriptID += 'html'

  var obj = document.getElementById(scriptID)
  if (obj != null) obj.remove()

  var obj = document.createElement('div')
  document.body.appendChild(obj)

  obj.id = scriptID
  obj.innerHTML = str
}

/*———————————————————————————————————————— loadCss(str)

    installs a CSS sheet */

function loadCss(scriptID, str, arg){
  scriptID += 'css'
//  document.getElementsByTagName('style')[0].innerHTML = str

  var obj = document.getElementById(scriptID)
  if (obj != null) obj.remove()

  var obj = document.createElement('style')
  document.head.appendChild(obj)

  obj.ID = scriptID
  obj.innerHTML = str
}

/*———————————————————————————————————————— loadJs(str)

function loadJs(scriptID, str, arg){

  var obj = document.createElement('script')
  document.body.appendChild(obj)

  obj.ID = scriptID

}

//:::::::::::::::::::::::::::::::::::::::: fetch functions

/*———————————————————————————————————————— parseScriptList(str)

    {"build":0, "source":"master.json"} */

function parseScriptList(scriptID, str, path){
  if (str == '') return true

  try{
    var arr = JSON.parse(str)
  }
  catch(e){ lert("JSON Parse Error\n" + e + '\n' + path) }

  for (var x=0; x<arr.length; x++){

    var scriptBuild  =  arr[x]['build']
    if (typeof scriptBuild == "string") continue // commment

    var scriptSource =  arr[x]['source']
    var parts = scriptSource.split('.')
    var scriptID     = parts[0]
    var scriptType   = parts[1]

    if (scriptBuild < 0){
      deleteElement(scriptType, scriptID)
      continue
    }

    var functionName = 'fetchScript'

    window[functionName](scriptBuild, scriptID, scriptSource, scriptType)
  }
}

/*———————————————————————————————————————— fetchScript(bld, which, src)

    */

function fetchScript(bld, which, src, scriptType){

  var lsRef  = scriptType + which
  var lsRef  = scriptType + which + 'build'

  // if it's already up to date
  if (typeof(localStorage[lsRef]) != 'undefined')
    if (bld <= localStorage[lsRef])
      return true

  src = scriptType + '/' + src

  var functionName = 'load' + capitalize(scriptType)

  var thisFun = window[functionName]

  if(LOCAL) fetchLocal(which, src, thisFun)
      else fetchRemote(which, src, thisFun)
}

/*———————————————————————————————————————— fetchLocal(path, callback)

    https://stackoverflow.com/questions/39989756/how-do-i-make-a-function-that-returns-the-value-of-a-local-text-file-in-javascri

    three params: ID, path, and callback function */

function fetchLocal(which, path, callback){

  fetchL(path)
    .then(function(text) {
      if (text != '') callback(which, text, path)
      else{
        lert('Empty File\n/' + path)
        callback('', '', path)
      }
    })

  .catch(function(err){
    lert('Fetch Error\n'+err+'\n/'+path)
    callback('', '', path)
  })
}

/*———————————————————————————————————————— fetchRemote(path, callback)

    https://github.com/Adobe-CEP/Getting-Started-guides/blob/master/Network%20requests%20and%20responses%20with%20Fetch/readme.md

    Note that fetch() is not the only way that CEP gives you to make network requests.

    Since Chromium Embedded Framework is essentially a browser, you can use
    an XMLHttpRequest (or a client-side library that wraps it, such as jQuery)
    You can also take advantage of Node.js within CEP, which gives you even
    more alternatives for making network requests.

    three params: ID, path, and callback function */

function fetchRemote(which, path, callback) {

  path = 'https://' + SERVER + '/' + VERSION +'/'+ path
  var pathRand = path + '?' + Math.random()

  fetch(pathRand)
    .then(function(res){
      if (res.ok){
        return res.text()
      }
    })
    .then(function(text){
      if (typeof text != 'undefined'){
        if (text != '') callback(which, text, path)
        else{
          lert('Empty File\n' + path)
          callback('', '', path)
        }
      }
      else {
        lert('404 Error\n' + path)
        callback('', '', path)
      }
    })

  .catch(function(err){
    lert('Server not found\n' + path)
    callback('', '', path)
   })
}

/*———————————————————————————————————————— fetchL(file)

    replaces "fetch" function for server */

function fetchL(file) {

  return new Promise(function(resolve, reject) {
    var rawFile = new XMLHttpRequest()
    rawFile.open("GET", file, false)
    rawFile.onreadystatechange = function (){
      if(rawFile.readyState === 4)
          if(rawFile.status === 200 || rawFile.status == 0)
              resolve(rawFile.responseText)
    }

    rawFile.onerror = reject
    rawFile.send(null)
  })
}


//:::::::::::::::::::::::::::::::::::::::: utilities

/*———————————————————————————————————————— deleteElement(scriptType, scriptID)

    deletes HTML, JS or CSS given an ID */

function deleteElement(scriptType, scriptID){

  scriptID += scriptType

  lert('going to Script Deletion\nDeleting object '+scriptID+' of type '+scriptType)

  obj = document.getElementById(scriptID)
  if (obj == null) return true

  lert('Script Deletion\nDeleting object '+scriptID+' of type '+scriptType)

  if (scriptType == 'css')
    obj.querySelectorAll('link[rel="stylesheet"], style').forEach(elem => elem.parentNode.removeChild(elem))

  else obj.remove()
}

/*———————————————————————————————————————— stripExtension(str)

    strips everything after last period */

function stripExtension(str){
  if (str.indexOf('.') < 0) return str

  var dotIndex = str.lastIndexOf('.')
  return str.substr(0, dotIndex)
}

/*———————————————————————————————————————— capitalize first letter
    */

function capitalize(str){
  return str.charAt(0).toUpperCase()+str.slice(1)
}

/*———————————————————————————————————————— lert(msg)

    alerts in ai-land don't exit program space */

function lert(msg){
  msg = JSON.stringify(String(msg))
  msg = msg.substr(1, msg.length-2)

  CEP.evalScript('alert("' + msg + '")')
}
