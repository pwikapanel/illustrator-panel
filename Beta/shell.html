<!DOCTYPE html><html><head><meta charset="utf-8">

<script>// startChrono() & stopChrono(t)

var globalTimer = startChrono()

function startChrono(){
  var d = new Date()
  return d.getTime()
}

function stopChrono(t){
  var d = new Date()
  return d.getTime() - t
}

</script>
