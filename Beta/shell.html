<!DOCTYPE html><html><head><meta charset="utf-8"><script>

var globalTimer = startChrono()

//———————————————————————————————————————— startChrono()

function startChrono(){
  var d = new Date()
  return d.getTime()
}

//———————————————————————————————————————— stopChrono(startTime)

function stopChrono(startTime){
  var d = new Date()
  return d.getTime()-startTime
}


</script>
<script type="text/javascript" src="CSXS/CSInterface.js"></script>
<script src='shell.js'></script>

<style>  #reloader{
    cursor:pointer ; width:10px;height:10px;
  position:absolute;   top: 0px; right: 0px;
  background-color:gray;
} </style>

</head><body oncontextmenu='return false'><div id="reloader" onclick='localStorage.clear();location.reload()'></div><script> 

console.log('032 body - waiting for script: ' + stopChrono(globalTimer) + ' ms')

loadPage()
//waitForScript()

function waitForScript(){
  if (typeof shellLoaded == 'undefined')
    setTimeout(waitForScript, 500)
  else {
    console.log('040 body - script loaded: ' + stopChrono(globalTimer) + ' ms')
    loadPage()
  }
}

function loadPage(){
  var path = 'json/manifest.json'

  if (LOCAL) fetchLocal ('manifest', path, loadManifest)
  else       fetchRemote('manifest', path, loadManifest)
}

</script></body></html>
