  <script>

//———————————————————————————————————————— CEP required

var CEP            = new CSInterface()
var TRANSLATE      = CEP.initResourceBundle(); // https://github.com/Adobe-CEP/CEP-Resources/blob/master/CEP_11.x/Documentation/CEP%2011.1%20HTML%20Extension%20Cookbook.md
var HOSTENV        = CEP.getHostEnvironment()
var TOOLSPATH      = CEP.getSystemPath(SystemPath.EXTENSION)

//———————————————————————————————————————— catch errors

window.addEventListener('error', (event)=>{
  var str = encodeURI(event.message)
      str = `alert("${event.message}")`
  CEP.evalScript(str)
})

/*———————————————————————————————————————— timer

    used to make sure everything is efficient */

var d              = new Date()
var TIMER          = d.getTime()

console.log('msec  line#   comments...\n———————————————————————————————')

var ELAPSEDEPTH = 0

function elapse(line, str){
  var d = new Date()
  var t = d.getTime() - TIMER
  str = fiveDigits(t, 5) + ' #' + fiveDigits(line, 4) + '   ' + str
  console.log(str)
}

function elapseGroup(line, str){
  var d = new Date()
  var t = d.getTime() - TIMER
  str = fiveDigits(t, 5) + ' #' + fiveDigits(line, 4) + '   ' + str
  console.groupCollapsed(str)
  ELAPSEDEPTH += 1
}

function elapseGroupEnd(line, str){
  if (ELAPSEDEPTH == 0) return

  console.groupEnd()
  ELAPSEDEPTH -= 1
}

function fiveDigits(i, n){
  v = '000000' + i
  return v.slice(0-n)
}

elapse(88, `starting Svija Tools`)


  </script>
