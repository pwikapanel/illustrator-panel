  <g id="CP_Hero" data-name="CP Hero">
    <text id="body_text" data-name="body text" class="cls-2" transform="translate(119.1 289.325)"><tspan class="cls-6" x="0" y="0">When the users clicks the &quot;Send&quot; button, </tspan><tspan class="cls-20" x="248.858" y="0">the message will open in </tspan><tspan class="cls-20" x="0" y="24">his or her email program</tspan><tspan class="cls-6" x="161.695" y="24">, ready to be sent.</tspan><tspan class="cls-6" x="0" y="58">The benefit of this system is that when you receive the message, </tspan><tspan class="cls-20" x="391.593" y="58">you </tspan><tspan class="cls-20" x="0" y="82">are absolutely sure to have the correct email address</tspan><tspan class="cls-6" x="346.235" y="82">.</tspan><tspan class="cls-6" x="0" y="116">The default text is defined in </tspan><tspan class="cls-20" x="175.206" y="116">Svija Cloud › Sections</tspan><tspan class="cls-6" x="312.172" y="116">.</tspan></text>
    <text id="body_text-2" data-name="body text" class="cls-1" transform="translate(119.1 473.637)"><tspan class="cls-3"><tspan x="0" y="0">There is a tool to help you convert the correct pixel dimensions of </tspan></tspan><tspan class="cls-3"><tspan x="0" y="24">your fields into CSS format:</tspan></tspan><tspan class="cls-12"><tspan x="0" y="58">files.svija.love/formulaire</tspan></tspan></text>
    <text id="headline" class="cls-23" transform="translate(119 256.553)"><tspan x="0" y="0">Contact Us</tspan></text>
    <line class="cls-21" x1="94.5" y1="435" x2="550.53" y2="435"/>
    <a xlink:href="https://files.svija.love/formulaire">
