	<feComposite in="SourceGraphic" in2="f3" result="f4" operator="in" />
	<feColorMatrix type="matrix" values="1 0 0 0 0.22      0 1 0 0 0.22      0 0 1 0 0.22      0 0 0 1 0" in="f4" result="f5" />
