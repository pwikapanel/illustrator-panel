	<feColorMatrix type="matrix" values="-17 0 0 0 8      -17 0 0 0 8     -17 0 0 0 8      0 0 0 0 1" in="f1" result="f2" />
	<feColorMatrix type="luminanceToAlpha" in="f2" result="f3" />
