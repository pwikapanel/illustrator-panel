<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head><meta charset="utf-8">
<script type="text/javascript" src="js/CSInterface.js"></script>
<script>

//localStorage.clear()

/*———————————————————————————————————————— create CS Interface */

var jsx = new CSInterface();

/*———————————————————————————————————————— lert(msg)

    alerts in ai-land don't exit program space */

function lert(msg){
  msg = JSON.stringify(String(msg));
  msg = msg.substr(1, msg.length-2)
  //alert(msg)
  jsx.evalScript('alert("' + msg + '")')
}

/*———————————————————————————————————————— announce any errors */

window.addEventListener('error', (event)=>{ lert(event.message) })

/*———————————————————————————————————————— script lists */

var  cssList = [ 'fonts'            ,
                 'colors-1'         ,
                 'layout'           ]

var htmlList = [ 'body'             ]

var  jsxList = [ 'preferencesUpdate',
                 'utilities'        ,
                 'statusUpdate'     ,
                 'savePage'         ,
                 'placeImage'       ,
                 'createGroup'      ,
                 'changeCase'       ,
                 'checkRepair'      ,
                 'newPage'          ]

var   jsList = [ 'colors'           ,
                 'tools'            ]

var  varList = [ 'version'          ,
                 'complete'         ]

/*———————————————————————————————————————— 1. if necessary, load files */

if(typeof localStorage.completeVar == 'undefined'){

  // load css ————————————————————————————————————————————————————————————————

  var    ext =   'css'
  var folder =   'css'

  readFiles(ext, folder, cssList)

  // load html ———————————————————————————————————————————————————————————————

  var    ext =   'html'
  var folder =   'html'

  readFiles(ext, folder, htmlList)

  // load jsx ————————————————————————————————————————————————————————————————

  var    ext =   'jsx'
  var folder =   'jsx'

  readFiles(ext, folder, jsxList)

  // load js —————————————————————————————————————————————————————————————————

  var    ext =   'js'
  var folder =   'js'

  readFiles(ext, folder, jsList)

  // load completion —————————————————————————————————————————————————————————

  var    ext =   'var'
  var folder =   'var'

  readFiles(ext, folder, varList)

}

else lert('already loaded')

/*———————————————————————————————————————— 2. check if more recent on server NOT DONE
    */





/*———————————————————————————————————————— 3. build panel from localStorage

    */


/* clear existing content, possibly unnecessary

document.querySelectorAll('[style]').forEach(el => el.removeAttribute('style'))
document.body.innerHTML = ''

*/

function rebuild(){
  for (var x=0; x<cssList.length; x++){ // CSS —————————————————————————————————
    var thisScript = cssList[x]
    var thisIndex = thisScript+'Css'
    var script = document.createElement('style')
    script.innerHTML = localStorage[thisIndex]
    document.head.appendChild(script)
  }
  
  for (var x=0; x<htmlList.length; x++){ // HTML ———————————————————————————————
    var thisScript = htmlList[x]
    var thisIndex = thisScript+'Html'
    document.body.innerHTML += localStorage[thisIndex]
  }

  for (var x=0; x<jsList.length; x++){ // HTML ———————————————————————————————
    var thisScript = jsList[x]
    var thisIndex = thisScript+'Js'
    var script = document.createElement('script')
    script.innerHTML = localStorage[thisIndex]
    document.body.appendChild(script)
  }
}


//:::::::::::::::::::::::::::::::::::::::: functions

/*———————————————————————————————————————— readFiles */

function readFiles(ext, folder, list){
  for (var x=0; x<list.length; x++)
    readFile(ext, folder, list[x]);
}

/*———————————————————————————————————————— readFile */

function readFile(extension, folderName, fileName){

  file = folderName + '/' + fileName + '.' + extension

// autoedit.gitbook.io/documentation/adobe-panel/autoedit-adobe-cep-panel-dev-setup/manifest.xml

  var rawFile = new XMLHttpRequest();
  rawFile.open("GET", file, false);
  rawFile.onreadystatechange = function ()
  {
    if(rawFile.readyState === 4)
      if(rawFile.status === 200 || rawFile.status == 0)
      {
        var varName = fileName + firstLetterCap(extension)
        localStorage[varName] = rawFile.responseText
      }
  }
  rawFile.send(null);
}

/*———————————————————————————————————————— firstLetterCap

    converts css into CSS to add to variable names */

function firstLetterCap(txt){
  var firstLetter = ext.substr(0,1).toUpperCase() 
  var restLetters = ext.substr(1, ext.length-1)
  return firstLetter + restLetters
}


</script></head><body oncontextmenu='return false'><script>

  rebuild()

</script></body></html>
