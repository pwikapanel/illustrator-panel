/*:::::::::::::::::::::::::::::::::::::::: control functions */

/*———————————————————————————————————————— getEnvironment(arg)

    gets info about ai-land and updates
    environmental variables in panel-land constantly.

    all info is stored in localStorage unless empty */

//setInterval(getEnvironmentInit, 300)

localStorage.myDocs = Illustrator.getSystemPath(SystemPath.MY_DOCUMENTS);

//setTimeout(function(){
setInterval(function(){
  var scrpt = 'getEnvironment("' + localStorage.myDocs + '")'
  Illustrator.evalScript(scrpt, getEnvironment)
}, 300);

//function getEnvironmentInit(){ Illustrator.evalScript('getEnvironment("' + localStorage.myDocs + '")', getEnvironment) }


var btnSaveTitle = btnSave.title

function getEnvironment(val){

  // 
  file = env_path + 'load-preferences.jsx'
  Illustrator.evalScript("$.evalFile('" + file + "')")

  var lines = val.split('¬')

  for (var x=0; x<lines.length; x+=1){
    var [key_, value_] = lines[x].split('|')
    if (value_ != '')
      localStorage.setItem(key_, value_);
  }

  // set online status light ————————————————————————————————————————

  if (navigator.onLine) indOnline.style.backgroundColor = 'var(--online)'
                   else indOnline.style.backgroundColor = 'var(--offline)'

  // set title ——————————————————————————————————————————————————————

  if (typeof localStorage.url == 'undefined')
    localStorage.url = ''

  if (localStorage.url != '')
    Illustrator.setWindowTitle(localStorage.url)
  else
    Illustrator.setWindowTitle('Svija Tools 3.0')

  // set save button mouseover ——————————————————————————————————————

  if (localStorage.openFiles == 0) btnSave.title = btnSave.alt
  else                             btnSave.title = btnSaveTitle

  // set grid spacing ———————————————————————————————————————————————

  var gridLine = localStorage.gridLine
  var gridSub  = localStorage.gridSub

  indGrid.value = gridLine + ' ⋮ ' + gridSub

  // point indicator  ———————————————————————————————————————————————

  if (localStorage.pointSnap == '1') indPoint.style.color = 'var(--indicatorOn)'
  else                               indPoint.style.color = 'var(--indicatorOff)'

  // pixel indicator  ———————————————————————————————————————————————

  if (localStorage.pixelSnap == '1') indPixel.style.color = 'var(--indicatorOn)'
  else                               indPixel.style.color = 'var(--indicatorOff)'


}

/*———————————————————————————————————————— save & open

    saves file
    +alt saves all files

    if no open file, will open a file
    +alt opens most recently closed file */

btnSave.addEventListener('click', (evn) => {
  var shift = evn.getModifierState('Shift');
  var ctrl  = evn.getModifierState('Control');
  var alt   = evn.getModifierState('Alt');

  // functions as a save button
  if (localStorage.openFiles > 0){
    aiTimeout('savePage(' + alt + ')',  'feedback', 100)
    return true
  }

  // open, no useful path
  if (localStorage.lastPath == ''){
    Illustrator.evalScript('menuCommand("open")'); 
    return true
  }

  // open, use last known path or file
  var str = localStorage.lastPath + '", "' + localStorage.url

  if (alt){ Illustrator.evalScript(  'openPage("' + str + '")') }
  else    { Illustrator.evalScript('openFolder("' + str + '")') }

  path = path.substr(0, path.lastIndexOf('/'))
  window.cep.process.createProcess(opener, path)

  else{
    bottomSection.style.display='block'

/*:::::::::::::::::::::::::::::::::::::::: utility functions */

/*———————————————————————————————————————— waitScreen()

    starts the wait screen during long operations
    called by aiTimeout() */

function waitScreen(){
  spinner.style.display='block'
}

/*———————————————————————————————————————— aiTimeout(script, callback, delay)

    executes a script after a short delay to give the spinner
    time to be displayed correctly */

function aiTimeout(script, callback, delay){
  waitScreen()
  setTimeout(Illustrator.evalScript, 1*delay, script, window[callback])
}

/*———————————————————————————————————————— feedbackSimple()

    feedback only if error, for simple operations */

  function feedbackSimple(arg){
    if (arg != ''){
      spinner.style.display='none'
      completion.style.display='block'
      completion.innerHTML = '<pre>' + arg + '</pre>'
      setTimeout(clearCompletion, 2000)
    }
  }

/*———————————————————————————————————————— feedback(arg)

    fils out feedback square */

var showTime = 6000

function feedback(arg){
  spinner.style.display='none'
  completion.style.display='block'
  completion.innerHTML = '<pre>' + arg + '</pre>'
  setTimeout(clearCompletion, showTime)
}

/*———————————————————————————————————————— clear completion */

  function clearCompletion(){
    completion.style.display = 'none'
  }

/*———————————————————————————————————————— isMac() */

function isMac(){
  var os = Illustrator.getOSInformation()
  if (os.substring(0,3) == 'Mac') return true
  else return false
}

/*———————————————————————————————————————— lert(msg)

    alerts in ai-land don't exit program space */

function lert(msg){
  msg = JSON.stringify(String(msg));
  msg = msg.substr(1, msg.length-2)
  //alert(msg)
  Illustrator.evalScript('alert("' + msg + '")')
}

/*———————————————————————————————————————— dumpLocal() */

// localStorage.removeItem('undefined')

function dumpLocal(){
  var res = 'localStorage contains '+localStorage.length + ' items:\n\n'

  for (var key in localStorage){
    if (localStorage.hasOwnProperty(key)){
      if (key.length       == 0      ) localStorage.removeItem(key)
      if (key.substr(0, 5) == 'Error') localStorage.removeItem(key)
      else
        res += key +': '+ localStorage[key] + '\n'
    }
  }

  alert(res)
}

/*———————————————————————————————————————— tooltips

                  'placeImage', 'changeCase', 'launchSite', 'launchCloud', 'showFolder', 'createGrp',
                  'makeHome',   'chkRepair',  'launchCache', 'newPage', 'newProject', 'getSupport']

for (x=0; x<targetList.length; x++){
  window[targetList[x]].addEventListener('mouseover', function(e){
    e.currentTarget.over = true
    setTimeout(showTip, ttDelay, e.currentTarget.id)
  })

  window[targetList[x]].addEventListener('mouseout' , function(e){
    e.currentTarget.over = false
    mouseover.innerHTML = ''
  })
}


function showTip(objName){
  if(window[objName].over)
    mouseover.innerHTML = window[objName].title
}

	function onclickClearPanelMenu() {
		ai.setPanelFlyoutMenu("", setPanelCallback);
		setMenuXML = "";
		setMenuList();
	}

	function onclickReset() {
  	GreenLightImg.style.display='none'
  	GreenLightImg2.style.display='none'
  	GreenLightImg3.style.display='none'
		document.getElementById("ReturnObject").value = "";
	}	
	
	function onclickUpdateMenuItem(){
		var list = document.getElementById("LabelList");	
		ai.updatePanelMenuItem(list.options[list.selectedIndex].text, document.getElementById("ItemEnabled").checked, document.getElementById("ItemChecked").checked);
	}
	
	function setMenuList() { 
		var list = document.getElementById("LabelList");
		list.innerHTML = "";
		xmlDoc = $.parseXML(setMenuXML),
		$xml = $(xmlDoc);
		var i = 0;
		$($xml).find("MenuItem").each(function() {
			var option = document.createElement("option");
			var name = $(this).attr("Label");
			if (-1 == name.indexOf('---')) {
			    option.value = ++i;
				option.appendChild(document.createTextNode(name));
				list.appendChild(option);
			}
		});
	}

    window.onload = function() {
  	GreenLightImg.style.display='none'
  	GreenLightImg2.style.display='none'
  	GreenLightImg3.style.display='none'
		ai.addEventListener("com.adobe.csxs.events.flyoutMenuClicked", setPanelCallback);
		ai.addEventListener("com.adobe.csxs.events.flyoutMenuOpened", setPanelCallback);
		ai.addEventListener("com.adobe.csxs.events.flyoutMenuClosed", setPanelCallback);
		checkCapabilities();
    } 

</script>
