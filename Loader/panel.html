/*———————————————————————————————————————— fetchLocal(path, callback)

    https://stackoverflow.com/questions/39989756/how-do-i-make-a-function-that-returns-the-value-of-a-local-text-file-in-javascri */

function fetchLocal(which, path, callback){

  fetchL(path)
    .then(function(text) {
      if (text != '') callback(which, text, path)
      else{
        lert('Empty File\n/' + path)
        callback('', '', path)
      }
    })

  .catch(function(err){
    lert('Missing File\n/'+path)
    callback('', '', path)
  })
}

/*———————————————————————————————————————— fetchRemote(path, callback)

    https://github.com/Adobe-CEP/Getting-Started-guides/blob/master/Network%20requests%20and%20responses%20with%20Fetch/readme.md

    Note that fetch() is not the only way that CEP gives you to make network requests.

    Since Chromium Embedded Framework is essentially a browser, you can use
    an XMLHttpRequest (or a client-side library that wraps it, such as jQuery)
    You can also take advantage of Node.js within CEP, which gives you even
    more alternatives for making network requests. */


function fetchRemote(which, path, callback) {

  path = SERVER + path
  var pathRand = path + '?' + Math.random()

  fetch(pathRand)
    .then(function(res){
      if (res.ok){
        return res.text()
      }
    })
    .then(function(text){
      if (typeof text != 'undefined'){
        if (text != '') callback(which, text, path)
        else{
          lert('Empty File\n' + path)
          callback('', '', path)
        }
      }
      else {
        lert('404 Error\n' + path)
        callback('', '', path)
      }
    })

  .catch(function(err){
    lert('Server not found\n' + path)
    callback('', '', path)
   })
}

/*———————————————————————————————————————— parseScriptList(str)

    {"build":0, "source":"master.json","type":"json"} */

function parseScriptList(which, str, path){


  if (str == '') return true

  try{
    var arr = JSON.parse(str)
  }
  catch(e){ lert("THIS\n" + e + '\n' + path) }
 
  for (var x=0; x<arr.length; x++){
    var scriptBuild  =  arr[x]['build']
    var scriptSource =  arr[x]['source']
    var which        = stripExtension(scriptSource)
    var scriptType   =  arr[x]['type']

    var functionName = 'fetch' + capitalize(scriptType)

    window[functionName](scriptBuild, which, scriptSource)
  }
}

  var which = stripExtension(src)
  var lsRef   = scType + which
  var lsBuild = scType + which + 'build'

  // if it's already up to date
  if (typeof(localStorage[lsBuild]) != 'undefined')
    if (bld <= localStorage[lsBuild])
      return true

  src = scType + '/' + src

  if(LOCAL) fetchLocal(which, src, loadJs)
      else fetchRemote(which, src, loadJs)
}

/*———————————————————————————————————————— removeStyles()

    removes all declared CSS styles
    used when loading a new stylesheet */

function removeStyles() {
  document.querySelectorAll('link[rel="stylesheet"], style')
    .forEach(elem => elem.parentNode.removeChild(elem));
}

/*———————————————————————————————————————— stripExtension(str)

    strips everything after last period */

function stripExtension(str){
  if (str.indexOf('.') < 0) return str

  var dotIndex = str.lastIndexOf('.')
  return str.substr(0, dotIndex)
}

/*———————————————————————————————————————— capitalize first letter
    */

function capitalize(str){
  return str.charAt(0).toUpperCase()+str.slice(1)
}

/*———————————————————————————————————————— fetchL(file)

    replaces "fetch" function for server */

function fetchL(file) {
  lert('fetchL\n' + file)
  return new Promise(function(resolve, reject) {
    var rawFile = new XMLHttpRequest()
    rawFile.open("GET", file, false)
    rawFile.onreadystatechange = function (){
      if(rawFile.readyState === 4)
          if(rawFile.status === 200 || rawFile.status == 0)
              resolve(rawFile.responseText)
    }

    rawFile.onerror = reject
    rawFile.send(null)
  })
}

/*———————————————————————————————————————— lert(msg)

    alerts in ai-land don't exit program space */

function lert(msg){
  msg = JSON.stringify(String(msg))
  msg = msg.substr(1, msg.length-2)

  cep.evalScript('alert("' + msg + '")')
}

/*———————————————————————————————————————— getInterfaceCode()

  https://fenomas.com/2014/09/cep-5-events-en/

  returns 0-3, corresponding to the 4 shades
  of interface colors availablein Ai prefs */

function getInterfaceCode() { // did have (event) as arg

  var hostEnv  = window.__adobe_cep__.getHostEnvironment()
  var skinInfo = JSON.parse(hostEnv).appSkinInfo
  var color    = skinInfo.panelBackgroundColor.color

  switch(color.red) {
  case  50: code = 0; break
  case 184: code = 2; break
  case 240: code = 3; break
   default: code = 1; break // case 83
  }

  return code
}
