// https://github.com/Adobe-CEP/CEP-Resources/issues/238

  csif.addEventListener('show-svija-tools', () => { showHidePanel(); })

  function showHidePanel(){
    var isVisible = csif.isWindowVisible();
  
    var bundleID  = 'love.svija.SvijaTools';
  	if (isVisible == 'true') csif.closeExtension();
    else csif.requestOpenExtension(bundleID);
  }

//———————————————————————————————————————— capture cmd-F2 › F4

  csif.addEventListener('save-all', () => { funcMoux('', 'saveAsSvg.jsx', 'all'); })
  csif.addEventListener('close-save-all', () => { funcMoux('', 'saveAsSvg.jsx', 'close'); })

  // copied from funcMou in indexLinks.js

  var path = csif.getSystemPath(SystemPath.EXTENSION) + '/host/';
  
  function funcMoux(btnId, scriptName, arg){
    file = path + scriptName;
    csif.evalScript("arg = '" + arg + "'");
    csif.evalScript("$.evalFile('" + file + "')");
  }
