  <script>

//———————————————————————————————————————— CEP required

var VERSION        = '1.0.7'
var CEP            = new CSInterface()
CEP.setContextMenu('<Menu></Menu>', function(){})

var TRANSLATE      = CEP.initResourceBundle() 
var ISMAC          = CEP.getOSInformation().substring(0,3) == 'Mac' // boolean    macOS boolean · set in projectManager.js
var PANELPATH      = CEP.getSystemPath(SystemPath.EXTENSION)
var MYDOCS         = CEP.getSystemPath(SystemPath.MY_DOCUMENTS) // has wrong format (/ not \
if (!ISMAC) MYDOCS = MYDOCS.replace(/\//g, '\\')

var HOSTENV        = CEP.getHostEnvironment()
var LC             = HOSTENV.appUILocale.substr(0,2) // en_US
var AIVERSION      = HOSTENV.appVersion // illustrator version

//———————————————————————————————————————— catch errors

window.addEventListener('error', (event)=>{
  var str = encodeURI(event.message)
      str = `alert("${event.message}")`
  CEP.evalScript(str)
})

/*———————————————————————————————————————— timer

    used to make sure everything is efficient */

var d              = new Date()
var TIMER          = d.getTime()

console.log('msec  line#   comments...\n———————————————————————————————')

var ELAPSEDEPTH = 0

function elapse(line, str){
  var d = new Date()
  var t = d.getTime() - TIMER
  str = fiveDigits(t, 5) + ' #' + fiveDigits(line, 4) + '   ' + str
  console.log(str)
}

function elapseGroup(line, str){
  var d = new Date()
  var t = d.getTime() - TIMER
  str = fiveDigits(t, 5) + ' #' + fiveDigits(line, 4) + '   ' + str
  console.groupCollapsed(str)
  ELAPSEDEPTH += 1
}

function elapseGroupEnd(line, str){
  if (ELAPSEDEPTH == 0) return

  console.groupEnd()
  ELAPSEDEPTH -= 1
}

function fiveDigits(i, n){
  v = '000000' + i
  return v.slice(0-n)
}

elapseGroup(88, `starting Pwika`)


  </script></>
